    <path d="M54 92 Q54 50 100 50 Q146 50 146 92 Q146 118 130 126 L130 140 Q130 150 118 150 L82 150 Q70 150 70 140 L70 126 Q54 118 54 92 Z" fill="#F3F1FA"/>
