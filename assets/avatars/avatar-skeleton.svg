      <stop offset="0" stop-color="#9E80FF"/>
      <stop offset="1" stop-color="#6E4DE0"/>
    </linearGradient>
    <radialGradient id="skVig" cx="0.5" cy="0.4" r="0.78">
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A8A" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="skEye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7BF3FF"/>
      <stop offset="0.55" stop-color="#10C7E8"/>
