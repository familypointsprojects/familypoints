  <!-- teeth -->
  <g stroke="#10233F" stroke-width="3.5">
    <rect x="80" y="140" width="40" height="16" rx="4" fill="#ffffff"/>
    <line x1="93.3" y1="140" x2="93.3" y2="156"/>
    <line x1="106.6" y1="140" x2="106.6" y2="156"/>
