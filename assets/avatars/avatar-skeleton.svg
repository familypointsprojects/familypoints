  </defs>
  <rect x="2" y="2" width="196" height="196" rx="32" fill="url(#skBg)"/>
  <rect x="2" y="2" width="196" height="196" rx="32" fill="url(#skVig)"/>
  <!-- crossbones -->
  <g stroke="#10233F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M44 150 L156 196 M156 150 L44 196" stroke="#E8E3F2" stroke-width="13"/>
    <g fill="#E8E3F2">
      <circle cx="44" cy="150" r="9"/><circle cx="44" cy="196" r="9"/>
      <circle cx="156" cy="150" r="9"/><circle cx="156" cy="196" r="9"/>
    </g>
  </g>
  <g stroke="#10233F" stroke-width="5" stroke-linejoin="round">
