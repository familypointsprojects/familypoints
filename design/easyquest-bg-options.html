<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyQuest background options</title>
  <style>
    :root {
      --ink: #10233f;
      --paper: #f4f8ff;
      --line: rgba(16, 35, 63, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f1f5fb;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      margin: 0 auto;
      max-width: 1280px;
      padding: 30px;
    }

    h1 {
      font-size: 24px;
      line-height: 1.15;
      margin: 0 0 8px;
    }

    .intro {
      color: #66768a;
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 22px;
    }

    .option {
      background: white;
      border: 1px solid rgba(191, 215, 245, 0.82);
      border-radius: 18px;
      box-shadow: 0 18px 38px rgba(16, 35, 63, 0.08);
      padding: 14px;
    }

    .phone {
      aspect-ratio: 390 / 844;
      border: 10px solid #111827;
      border-radius: 42px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.42);
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .label {
      align-items: center;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-top: 12px;
    }

    .label strong {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .label span {
      color: #77879a;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
      text-align: right;
    }

    svg {
      display: block;
      height: 100%;
      width: 100%;
    }

    @media (max-width: 980px) {
      .grid { grid-template-columns: repeat(2, minmax(240px, 1fr)); }
    }

    @media (max-width: 640px) {
      .page { padding: 18px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
